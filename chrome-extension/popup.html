<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2329; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3370ff; }
    .page { background: #f5f6f8; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .page .t { font-weight: 600; max-height: 38px; overflow: hidden; }
    .page .u { color: #8f959e; font-size: 11px; word-break: break-all; max-height: 28px; overflow: hidden; }
    label { font-size: 12px; color: #646a73; display: block; margin: 8px 0 4px; }
    textarea { width: 100%; height: 56px; resize: none; border: 1px solid #dee0e3; border-radius: 8px; padding: 8px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; border: none; border-radius: 8px; padding: 9px 0; font: inherit; font-weight: 600; cursor: pointer; }
    .primary { background: #3370ff; color: #fff; }
    .ghost { background: #fff; color: #3370ff; border: 1px solid #3370ff; }
    .hint { color: #8f959e; font-size: 11px; margin-top: 10px; line-height: 1.4; }
    a { color: #3370ff; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> acaily 一键总结</h1>
  <div class="page">
    <div class="t" id="pageTitle">读取当前页面中…</div>
    <div class="u" id="pageUrl"></div>
  </div>
  <label for="instruction">附加指令（可选）</label>
  <textarea id="instruction" placeholder="例如：用三点总结，并给出行动建议"></textarea>
  <div class="row">
    <button class="primary" id="summarize">总结当前页面</button>
  </div>
  <div class="row">
    <button class="ghost" id="openApp">打开 acaily</button>
  </div>
  <div class="hint">会跳转到 acaily 网页版并自动填入内容发送。需先在网页版登录飞书账号。</div>
  <script src="popup.js"></script>
</body>
</html>
