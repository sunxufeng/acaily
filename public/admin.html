<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Acaily · 管理后台</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --primary:#3370ff; --ok:#34c724; --err:#f54a45; --text:#1f2329; --muted:#8f959e; --border:#dee0e3;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:1080px;margin:20px auto;padding:0 16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h1{font-size:20px;margin:0;}
  .links{display:flex;gap:12px;align-items:center;font-size:13px;}
  .link{color:var(--primary);text-decoration:none;cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:120px;}
  .stat .n{font-size:22px;font-weight:700;color:var(--primary);}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}
  td .name{font-weight:600;}
  td .oid{font-size:11px;color:var(--muted);}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eef1f6;color:#445;}
  .pill.yes{background:#e8f9ec;color:#1a7f37;}
  .pill.admin{background:#fff2e0;color:#b76e00;}
  button{font-size:13px;}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:7px;padding:6px 12px;cursor:pointer;}
  .btn.ghost{background:#eef1f6;color:var(--text);}
  .btn.danger{background:#fdeceb;color:#b42318;}
  .actions{display:flex;gap:6px;}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding-top:48px;z-index:50;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:560px;max-width:94vw;padding:20px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .modal h2{font-size:17px;margin:0 0 12px;}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit;}
  textarea{resize:vertical;min-height:64px;}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);}
  .modal .actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .status{font-size:13px;margin-top:10px;}
  .status.ok{color:#1a7f37;} .status.err{color:#b42318;}
  .empty{color:var(--muted);padding:24px;text-align:center;}
  .errbox{padding:40px;text-align:center;color:var(--err);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>⚡ Acaily 管理后台</h1>
    <div class="links">
      <a class="link" href="/settings">个人设置</a>
      <a class="link" href="/logout">退出登录</a>
    </div>
  </div>

  <div id="app">
    <div class="empty">加载中…</div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h2 id="modalTitle">编辑用户配置</h2>
    <div id="modalBody"></div>
    <div class="actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(method, path, body){
  const opt = { method, headers:{} };
  if (body){ opt.headers['content-type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(()=>({}));
  return { status:r.status, data };
}

let CURRENT = null; // 当前编辑的 openId

(async () => {
  const me = await api('GET', '/api/me');
  if (me.status !== 200){ location.href='/login'; return; }
  if (me.data.role !== 'admin'){
    $('app').innerHTML = '<div class="errbox">⛔ 你没有管理员权限。如需访问管理后台，请联系系统管理员把你的 open_id 加入管理员列表。</div>';
    return;
  }
  await render();
})();

async function render(){
  const [usersRes, statsRes] = await Promise.all([
    api('GET', '/api/admin/users'),
    api('GET', '/api/admin/stats'),
  ]);
  if (usersRes.status !== 200){
    $('app').innerHTML = '<div class="errbox">加载用户列表失败：'+(usersRes.data.error||usersRes.status)+'</div>';
    return;
  }
  const users = usersRes.data.users || [];
  const stats = statsRes.data || {};
  const totalCalls = (stats.calls||[]).reduce((a,c)=>a+(c.count||0),0);

  let html = '<div class="stats">';
  html += `<div class="stat"><div class="n">${users.length}</div><div class="l">已配置用户</div></div>`;
  html += `<div class="stat"><div class="n">${(users.filter(u=>u.hasApiKey).length)}</div><div class="l">已填 API Key</div></div>`;
  html += `<div class="stat"><div class="n">${(users.filter(u=>u.botName).length)}</div><div class="l">配置专属机器人</div></div>`;
  html += `<div class="stat"><div class="n">${totalCalls}</div><div class="l">累计对话调用</div></div>`;
  html += '</div>';

  html += '<div class="card"><table><thead><tr>'+
    '<th>用户</th><th>Provider</th><th>Model</th><th>机器人</th><th>Key</th><th>更新时间</th><th>操作</th>'+
    '</tr></thead><tbody>';
  if (users.length === 0){
    html += '<tr><td colspan="7" class="empty">暂无用户配置</td></tr>';
  } else {
    for (const u of users){
      const isAdmin = (usersRes.data.adminOpenIds||[]).includes(u.openId);
      html += `<tr>
        <td><div class="name">${esc(u.displayName||'(未命名)')}</div><div class="oid">${esc(u.openId)}</div></td>
        <td>${esc(u.provider||'-')}</td>
        <td>${esc(u.model||'-')}</td>
        <td>${u.botName?`<span class="pill">${esc(u.botName)}</span>`:'-'}</td>
        <td>${u.hasApiKey?'<span class="pill yes">已填</span>':'<span class="pill">未填</span>'}</td>
        <td>${esc((u.updatedAt||'').slice(0,19).replace('T',' '))}</td>
        <td><div class="actions">
          <button class="btn" onclick="editUser('${esc(u.openId)}')">编辑</button>
          <button class="btn danger" onclick="deleteUser('${esc(u.openId)}')">删除</button>
        </div></td>
      </tr>`;
    }
  }
  html += '</tbody></table></div>';
  $('app').innerHTML = html;
}

window.editUser = async function(openId){
  CURRENT = openId;
  const res = await api('GET', '/api/admin/config/'+encodeURIComponent(openId));
  if (res.status !== 200){ alert('加载失败：'+(res.data.error||res.status)); return; }
  const c = res.data.config || {};
  $('modalTitle').textContent = '编辑：'+openId;
  $('modalBody').innerHTML = `
    <label>显示名称</label><input id="f_displayName" value="${esc(c.displayName||'')}" maxlength="60" />
    <label>Provider</label><select id="f_provider">
      ${['openai','anthropic','ollama','custom'].map(p=>`<option value="${p}" ${c.provider===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <label>Base URL</label><input id="f_baseUrl" value="${esc(c.baseUrl||'')}" />
    <label>API Key（留空=不修改；勾选下方可清除）</label><input id="f_apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <label style="font-weight:400;color:var(--muted)"><input type="checkbox" id="f_clearKey" style="width:auto;margin-right:6px;"/>清除已存 API Key</label>
    <label>Model</label><input id="f_model" value="${esc(c.model||'')}" />
    <label>Chat 接口路径</label><input id="f_chatCompletionsPath" value="${esc(c.chatCompletionsPath||'')}" />
    <label>Temperature</label><input id="f_temperature" type="number" step="0.1" min="0" max="2" value="${c.temperature??0.7}" />
    <label>Max Tokens</label><input id="f_maxTokens" type="number" step="1" min="1" value="${c.maxTokens??2048}" />
    <label>助手名称 (Bot Name)</label><input id="f_botName" value="${esc(c.botName||'')}" maxlength="40" />
    <label>自定义指令 (System Prompt)</label><textarea id="f_systemPrompt" maxlength="4000">${esc(c.systemPrompt||'')}</textarea>
    <div id="modalStatus" class="status"></div>
  `;
  $('mask').classList.add('show');
};

window.deleteUser = async function(openId){
  if (!confirm('确认删除用户 '+openId+' 的全部配置？此操作不可恢复。')) return;
  const res = await api('DELETE', '/api/admin/config/'+encodeURIComponent(openId));
  if (res.status === 200) await render();
  else alert('删除失败：'+(res.data.error||res.status));
};

$('modalCancel').onclick = () => $('mask').classList.remove('show');
$('modalSave').onclick = async () => {
  const body = {
    displayName: $('f_displayName').value.trim(),
    provider: $('f_provider').value,
    baseUrl: $('f_baseUrl').value.trim(),
    model: $('f_model').value.trim(),
    chatCompletionsPath: $('f_chatCompletionsPath').value.trim(),
    temperature: Number($('f_temperature').value),
    maxTokens: Number($('f_maxTokens').value),
    botName: $('f_botName').value.trim(),
    systemPrompt: $('f_systemPrompt').value,
  };
  const key = $('f_apiKey').value;
  if (key) body.apiKey = key;
  if ($('f_clearKey').checked) body.clearApiKey = true;
  const res = await api('PUT', '/api/admin/config/'+encodeURIComponent(CURRENT), body);
  const st = $('modalStatus');
  if (res.status === 200){ st.className='status ok'; st.textContent='✅ 已保存'; setTimeout(()=>{ $('mask').classList.remove('show'); render(); }, 600); }
  else { st.className='status err'; st.textContent='❌ '+(res.data.error||res.status); }
};
</script>
</body>
</html>
