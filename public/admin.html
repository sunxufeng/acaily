<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acaily · 管理后台</title>
<link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="logo">⚡</span><span>Acaily</span></div>
    <nav class="nav">
      <div class="nav-group">管理</div>
      <div class="nav-item active" data-view="dash"><span class="ic">📊</span><span>仪表盘</span></div>
      <div class="nav-item" data-view="users"><span class="ic">👥</span><span>用户管理</span></div>
      <div class="nav-item" data-view="audit"><span class="ic">🛡️</span><span>审计日志</span></div>
    </nav>
    <div class="side-foot">
      <div class="me">
        <img id="sbAvatar" alt="" />
        <div style="min-width:0;">
          <div class="nm" id="sbName">…</div>
          <div class="rl">管理员</div>
        </div>
        <span class="out" id="sbLogout">退出</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">仪表盘</h1>
        <div class="sub" id="pageSub">组织级概览与成员配置管理</div>
      </div>
      <div class="right">
        <a class="link" href="/settings">个人设置</a>
        <a class="link" href="/logout">退出登录</a>
      </div>
    </header>

    <div class="content">
      <!-- 仪表盘 -->
      <section class="view active" id="view-dash">
        <div class="stat-grid" id="statGrid">
          <div class="stat"><div class="n brand" id="sUsers">–</div><div class="l">已配置用户</div></div>
          <div class="stat"><div class="n ok" id="sKeys">–</div><div class="l">已填 API Key</div></div>
          <div class="stat"><div class="n" id="sBots">–</div><div class="l">配置专属机器人</div></div>
          <div class="stat"><div class="n" id="sCalls">–</div><div class="l">累计对话调用</div></div>
        </div>
        <div class="card">
          <div class="card-h"><h2>最近活动</h2><span class="desc">来自审计日志</span></div>
          <div class="table-wrap">
            <table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>目标</th><th>级别</th></tr></thead>
            <tbody id="recentBody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody></table>
          </div>
        </div>
      </section>

      <!-- 用户管理 -->
      <section class="view" id="view-users">
        <div class="card" style="padding:0;overflow:hidden;">
          <div class="card-h" style="padding:18px 18px 0;margin:0;">
            <h2>成员配置</h2><span class="desc">可代为编辑或清除任意成员的模型配置</span>
          </div>
          <div class="table-wrap" style="border:none;box-shadow:none;">
            <table><thead><tr><th>用户</th><th>Provider</th><th>Model</th><th>机器人</th><th>Key</th><th>更新时间</th><th>操作</th></tr></thead>
            <tbody id="usersBody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody></table>
          </div>
        </div>
      </section>

      <!-- 审计日志 -->
      <section class="view" id="view-audit">
        <div class="card" style="padding:0;overflow:hidden;">
          <div class="card-h" style="padding:18px 18px 0;margin:0;">
            <h2>审计日志</h2><span class="desc">配置变更、对话调用、密钥解密等敏感操作留痕</span>
          </div>
          <div class="table-wrap" style="border:none;box-shadow:none;">
            <table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>目标</th><th>级别</th><th>详情</th></tr></thead>
            <tbody id="auditBody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody></table>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h2 id="modalTitle">编辑用户配置</h2>
    <div id="modalBody"></div>
    <div class="actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn" id="modalSave">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
async function api(method,path,body){
  const opt={method,headers:{}};
  if(body){opt.headers['content-type']='application/json';opt.body=JSON.stringify(body);}
  const r=await fetch(path,opt);const data=await r.json().catch(()=>({}));return {status:r.status,data};
}
const titles={dash:['仪表盘','组织级概览与成员配置管理'],users:['用户管理','查看与编辑成员模型配置'],audit:['审计日志','安全合规操作留痕']};
document.querySelectorAll('.nav-item').forEach(it=>{it.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));it.classList.add('active');
  const v=it.dataset.view;document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('view-'+v).classList.add('active');$('pageTitle').textContent=titles[v][0];$('pageSub').textContent=titles[v][1];
};});

let ADMINS=[];let CURRENT=null;
(async()=>{
  const me=await api('GET','/api/me');
  if(me.status!==200){location.href='/login';return;}
  if(me.data.role!=='admin'){document.querySelector('.content').innerHTML='<div class="empty">⛔ 你没有管理员权限。</div>';return;}
  $('sbName').textContent=me.data.name||'未命名用户';
  if(me.data.avatar)$('sbAvatar').src=me.data.avatar;
  $('sbLogout').onclick=()=>location.href='/logout';
  await loadDashboard();await loadUsers();await loadAudit();
})();

async function loadDashboard(){
  const [u,s]=await Promise.all([api('GET','/api/admin/users'),api('GET','/api/admin/stats')]);
  if(u.status!==200)return;
  const users=u.data.users||[];ADMINS=u.data.adminOpenIds||[];
  const stats=s.data||{};
  const totalCalls=(stats.calls||[]).reduce((a,c)=>a+(c.count||0),0);
  $('sUsers').textContent=users.length;
  $('sKeys').textContent=users.filter(x=>x.hasApiKey).length;
  $('sBots').textContent=users.filter(x=>x.botName).length;
  $('sCalls').textContent=totalCalls;
  // 最近活动
  const ev=await api('GET','/api/admin/audit');
  const rows=(ev.data&&ev.data.events||[]).slice(0,8);
  $('recentBody').innerHTML=rows.length?rows.map(r=>auditRow(r)).join(''):'<tr><td colspan="5" class="empty">暂无审计记录</td></tr>';
}
async function loadUsers(){
  const res=await api('GET','/api/admin/users');
  if(res.status!==200){$('usersBody').innerHTML='<tr><td colspan="7" class="empty">加载失败</td></tr>';return;}
  const users=res.data.users||[];ADMINS=res.data.adminOpenIds||[];
  if(!users.length){$('usersBody').innerHTML='<tr><td colspan="7" class="empty">暂无用户配置</td></tr>';return;}
  $('usersBody').innerHTML=users.map(u=>{
    const isAdmin=ADMINS.includes(u.openId);
    return `<tr>
      <td><div class="nm">${esc(u.displayName||'(未命名)')}</div><div class="oid">${esc(u.openId)}</div></td>
      <td>${esc(u.provider||'-')}</td>
      <td>${esc(u.model||'-')}</td>
      <td>${u.botName?`<span class="pill brand">${esc(u.botName)}</span>`:'-'}</td>
      <td>${u.hasApiKey?'<span class="pill ok">已填</span>':'<span class="pill">未填</span>'}</td>
      <td class="muted">${esc((u.updatedAt||'').slice(0,19).replace('T',' '))}</td>
      <td><div class="actions">
        <button class="btn sm" onclick="editUser('${esc(u.openId)}')">编辑</button>
        <button class="btn sm danger" onclick="deleteUser('${esc(u.openId)}')">删除</button>
      </div></td></tr>`;
  }).join('');
}
async function loadAudit(){
  const res=await api('GET','/api/admin/audit');
  const rows=(res.data&&res.data.events||[]);
  $('auditBody').innerHTML=rows.length?rows.map(r=>auditRow(r,true)).join(''):'<tr><td colspan="6" class="empty">暂无审计记录</td></tr>';
}
function auditRow(r,full){
  const lvl=r.level==='error'?'err':r.level==='warn'?'warn':'';
  const detail=full?(r.meta?esc(JSON.stringify(r.meta).slice(0,80)):'-'):'';
  const cols=`<td class="muted">${esc((r.ts||'').slice(0,19).replace('T',' '))}</td>
    <td>${esc(r.actor||'-')}</td>
    <td>${esc(r.action||'-')}</td>
    <td>${esc(r.target||'-')}</td>
    <td>${lvl?`<span class="pill ${lvl}">${esc(r.level)}</span>`:'<span class="pill">info</span>'}</td>`;
  return '<tr>'+cols+(full?`<td class="muted">${detail}</td>`:'')+'</tr>';
}

window.editUser=async function(openId){
  CURRENT=openId;
  const res=await api('GET','/api/admin/config/'+encodeURIComponent(openId));
  if(res.status!==200){toast('加载失败：'+(res.data.error||res.status));return;}
  const c=res.data.config||{};
  $('modalTitle').textContent='编辑：'+(c.displayName||openId);
  $('modalBody').innerHTML=`
    <label>显示名称</label><input id="f_displayName" value="${esc(c.displayName||'')}" maxlength="60"/>
    <label>Provider</label><select id="f_provider">${['openai','anthropic','ollama','custom'].map(p=>`<option value="${p}" ${c.provider===p?'selected':''}>${p}</option>`).join('')}</select>
    <label>Base URL</label><input id="f_baseUrl" value="${esc(c.baseUrl||'')}"/>
    <label>API Key（留空=不修改；勾选下方可清除）</label><input id="f_apiKey" type="password" placeholder="sk-..." autocomplete="off"/>
    <label style="font-weight:400;color:var(--muted)"><input type="checkbox" id="f_clearKey" style="width:auto;margin-right:6px;"/>清除已存 API Key</label>
    <label>Model</label><input id="f_model" value="${esc(c.model||'')}"/>
    <label>Chat 接口路径</label><input id="f_chatCompletionsPath" value="${esc(c.chatCompletionsPath||'')}"/>
    <label>Temperature</label><input id="f_temperature" type="number" step="0.1" min="0" max="2" value="${c.temperature??0.7}"/>
    <label>Max Tokens</label><input id="f_maxTokens" type="number" step="1" min="1" value="${c.maxTokens??2048}"/>
    <label>助手名称 (Bot Name)</label><input id="f_botName" value="${esc(c.botName||'')}" maxlength="40"/>
    <label>自定义指令 (System Prompt)</label><textarea id="f_systemPrompt" maxlength="4000">${esc(c.systemPrompt||'')}</textarea>
    <div id="modalStatus" class="status"></div>`;
  $('mask').classList.add('show');
};
window.deleteUser=async function(openId){
  if(!confirm('确认删除用户 '+openId+' 的全部配置？此操作不可恢复。'))return;
  const res=await api('DELETE','/api/admin/config/'+encodeURIComponent(openId));
  if(res.status===200){toast('已删除');await loadUsers();}
  else toast('删除失败：'+(res.data.error||res.status));
};
$('modalCancel').onclick=()=>$('mask').classList.remove('show');
$('modalSave').onclick=async()=>{
  const body={
    displayName:$('f_displayName').value.trim(),provider:$('f_provider').value,baseUrl:$('f_baseUrl').value.trim(),
    model:$('f_model').value.trim(),chatCompletionsPath:$('f_chatCompletionsPath').value.trim(),
    temperature:Number($('f_temperature').value),maxTokens:Number($('f_maxTokens').value),
    botName:$('f_botName').value.trim(),systemPrompt:$('f_systemPrompt').value,
  };
  const key=$('f_apiKey').value;if(key)body.apiKey=key;if($('f_clearKey').checked)body.clearApiKey=true;
  const res=await api('PUT','/api/admin/config/'+encodeURIComponent(CURRENT),body);
  const st=$('modalStatus');
  if(res.status===200){st.className='status ok';st.textContent='✅ 已保存';setTimeout(()=>{$('mask').classList.remove('show');loadUsers();loadDashboard();},600);}
  else{st.className='status err';st.textContent='❌ '+(res.data.error||res.status);}
};
</script>
</body>
</html>
