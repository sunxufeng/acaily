<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Acaily · 个人设置</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --primary:#3370ff; --ok:#34c724; --err:#f54a45; --text:#1f2329; --muted:#8f959e; --border:#dee0e3;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:600px;margin:24px auto;padding:0 16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .who{display:flex;align-items:center;gap:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:#eef1f6;object-fit:cover;}
  .who .name{font-weight:600;font-size:15px;}
  .who .oid{font-size:12px;color:var(--muted);}
  .topbar .links{display:flex;gap:10px;align-items:center;}
  .link{font-size:13px;color:var(--primary);text-decoration:none;cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fff;font-family:inherit;}
  textarea{resize:vertical;min-height:72px;}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:11px 14px;color:#fff;background:var(--primary);transition:.15s;}
  button.ghost{background:#eef1f6;color:var(--text);}
  button:active{transform:translateY(1px);}
  .actions{display:flex;gap:10px;margin-top:18px;}
  .actions button{flex:1;}
  .status{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none;}
  .status.ok{display:block;background:#e8f9ec;color:#1a7f37;}
  .status.err{display:block;background:#fdeceb;color:#b42318;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  code{background:#f0f1f3;padding:1px 5px;border-radius:4px;font-size:12px;}
  .section-title{font-size:14px;font-weight:700;margin:4px 0 2px;color:var(--text);}
  .section-desc{font-size:12px;color:var(--muted);margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="who">
      <img class="avatar" id="avatar" alt="" />
      <div>
        <div class="name" id="name">…</div>
        <div class="oid" id="oid">open_id: …</div>
      </div>
    </div>
    <div class="links">
      <a class="link" id="adminLink" href="/admin" style="display:none;">管理后台</a>
      <a class="link" id="logoutLink">退出登录</a>
    </div>
  </div>

  <div class="card">
    <h1>个人模型设置</h1>
    <div class="sub">为你的飞书账号配置专属大模型。API Key 经信封加密后入库，明文不出服务端。</div>

    <label>模型 Provider <span style="color:var(--err)">*</span></label>
    <select id="provider">
      <option value="openai">OpenAI 兼容</option>
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="ollama">Ollama（本地）</option>
      <option value="custom">自建网关（OpenAI 兼容）</option>
    </select>

    <label>Base URL <span style="color:var(--err)">*</span></label>
    <input id="baseUrl" placeholder="https://api.openai.com/v1 或 http://localhost:11434" />
    <div class="hint">OpenAI 兼容填 <code>/v1</code> 结尾；Ollama 默认 <code>http://localhost:11434</code></div>

    <label>API Key <span style="color:var(--err)">*</span>（Ollama 可留空）</label>
    <input id="apiKey" type="password" placeholder="sk-...（留空则不修改已存密钥）" autocomplete="off" />

    <label>Model <span style="color:var(--err)">*</span></label>
    <input id="model" placeholder="gpt-4o / claude-3-5-sonnet / qwen2.5:7b" />

    <label>Chat 接口路径 <span class="hint" style="font-weight:400">（自建网关可选）</span></label>
    <input id="chatCompletionsPath" placeholder="/v1/chat/completions（留空=直接用 Base URL 作为接口地址）" />
    <div class="hint">若把整条接口地址填进了 Base URL，此处留空即可；否则填 /v1/chat/completions 之类。</div>

    <div class="row" style="margin-top:14px;">
      <div>
        <label style="margin-top:0;">Temperature</label>
        <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.7" />
      </div>
      <div>
        <label style="margin-top:0;">Max Tokens</label>
        <input id="maxTokens" type="number" step="1" min="1" value="2048" />
      </div>
    </div>

    <div class="section-title" style="margin-top:18px;">专属机器人</div>
    <div class="section-desc">配置你自己的助手名称与个性指令，让这位「机器人」只属于你。</div>

    <label>助手名称（Bot Name）</label>
    <input id="botName" placeholder="例如：小艾 / 助理 / 你的昵称（留空则用默认 Acaily）" maxlength="40" />

    <label>自定义指令（System Prompt）</label>
    <textarea id="systemPrompt" placeholder="例如：你是一位严谨的财务分析师，回答需给出数据来源；默认用中文；遇到不确定的事要明确说不知道。" maxlength="4000"></textarea>

    <div class="actions">
      <button id="saveBtn">保存配置</button>
      <button id="testBtn" class="ghost">连通性测试</button>
    </div>
    <div id="status" class="status"></div>
  </div>
  <div class="card">
    <div class="sub">说明：本页仅你本人可访问（飞书登录后由服务端注入你的身份）；配置与对话均按你的 open_id 租户隔离。</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function show(msg, ok){ const s=$('status'); s.textContent=msg; s.className='status '+(ok?'ok':'err'); }
async function api(method, path, body){
  const opt = { method, headers:{} };
  if (body){ opt.headers['content-type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(()=>({}));
  return { status:r.status, data };
}

(async () => {
  // 身份校验：未登录 → 登录页
  const me = await api('GET', '/api/me');
  if (me.status !== 200){ location.href = '/login'; return; }
  $('name').textContent = me.data.name || '未命名用户';
  $('oid').textContent = 'open_id: ' + me.data.openId;
  if (me.data.avatar) $('avatar').src = me.data.avatar;
  if (me.data.role === 'admin') $('adminLink').style.display = 'inline';

  $('logoutLink').onclick = () => { location.href = '/logout'; };

  // 载入已有配置（404 表示尚未配置，用空表单）
  const cfgRes = await api('GET', '/api/config/me');
  if (cfgRes.status === 200 && cfgRes.data.config){
    const c = cfgRes.data.config;
    $('provider').value = c.provider || 'openai';
    $('baseUrl').value = c.baseUrl || '';
    $('model').value = c.model || '';
    $('chatCompletionsPath').value = c.chatCompletionsPath || '';
    $('temperature').value = (c.temperature ?? 0.7);
    $('maxTokens').value = (c.maxTokens ?? 2048);
    $('botName').value = c.botName || '';
    $('systemPrompt').value = c.systemPrompt || '';
  }

  function collect(includeKey){
    const c = {
      provider: $('provider').value,
      baseUrl: $('baseUrl').value.trim(),
      model: $('model').value.trim(),
      chatCompletionsPath: $('chatCompletionsPath').value.trim(),
      temperature: Number($('temperature').value),
      maxTokens: Number($('maxTokens').value),
      botName: $('botName').value.trim(),
      systemPrompt: $('systemPrompt').value,
    };
    if (includeKey && $('apiKey').value) c.apiKey = $('apiKey').value;
    return c;
  }

  $('saveBtn').onclick = async () => {
    const c = collect(true);
    if(!c.provider||!c.baseUrl||!c.model){ return show('请填写 Provider / Base URL / Model', false); }
    const { status, data } = await api('POST', '/api/config/me', c);
    if(status===200) show('✅ 配置已保存（API Key 已加密入库）', true);
    else show('❌ 保存失败：'+(data.error||status), false);
  };

  $('testBtn').onclick = async () => {
    const c = collect(true);
    if(!c.provider||!c.baseUrl||!c.model){ return show('请先填写 Provider / Base URL / Model', false); }
    show('⏳ 正在测试连通性…', true);
    const { status, data } = await api('POST', '/config/test', { provider:c.provider, baseUrl:c.baseUrl, apiKey:c.apiKey, model:c.model, chatCompletionsPath:c.chatCompletionsPath });
    if(data && data.ok) show('✅ 连通性正常：'+(data.provider||'')+' / '+(data.model||''), true);
    else show('❌ 连通失败：'+(data&&data.error||status) + (data&&data.attemptedUrl ? ' ｜ 请求地址：'+data.attemptedUrl : ''), false);
  };
})();
</script>
</body>
</html>
